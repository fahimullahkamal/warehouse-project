<!doctype html>
<html lang="en" dir="rtl" lang="far">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Light IMS | Loading</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {


      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      unicode-bidi: plaintext;
      min-height: 100vh;
      background: radial-gradient(circle at 30% 10%, #1e1029, #0f0717);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family:
        "Segoe UI",
        "Poppins",
        system-ui,
        -apple-system,
        sans-serif;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* WhatsApp support link - new style */
    .btn_box {
      height: fit-content;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn_box .email_btn {
      border-style: none;
      outline-style: none;
      color: #72066d;

      transition: all ease-in 200ms;
    }

    .btn_box .email_btn:hover {


      transform: scale(1.03);
    }

    .btn_box .whatsapp_btn {
      border-style: none;
      outline-style: none;
      color: #07764f;

      transition: all ease-in 100ms;
    }

    .btn_box .whatsapp_btn:hover {


      transform: scale(1.03);
    }

    .btn_box .whatsapp_btn {
      border-style: none;
      outline-style: none;
      color: #07764f;

    }

    .support-wa {
      margin-top: 1rem;
      height: fit-content;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.6rem;
      text-align: center;
    }

    .support-wa button {
      width: fit-content;
      height: fit-content;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.1rem;
      outline-style: none;
      border-style: none;
      border-radius: 3rem;
      cursor: pointer;
      opacity: 0.5;
      transition: all ease-in 200ms;
    }

    .support-wa button:hover {
      opacity: 1;
    }

    .support-wa svg {
      width: 1.5rem;
      height: 1.5rem;

    }

    /* Loading screen - LTR, English */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 30% 10%, #1e1029, #0f0717);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition:
        opacity 0.5s ease,
        visibility 0.5s ease;
    }

    .loading-container {
      max-width: 620px;
      width: 90%;
      background: rgba(255, 255, 255, 0);
      backdrop-filter: blur(3px);
      border-radius: 3rem;
      padding: 2rem 1.5rem 2.2rem 1.5rem;
      box-shadow:
        0 25px 45px rgba(0, 0, 0, 0.4),
        inset 0 1px 1px rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(235, 185, 32, 0.2);
      text-align: left;
      direction: ltr;
    }

    .brand-wrapper {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      margin-bottom: 2.5rem;
    }

    .logo-svg {
      display: block;
      width: 100%;
      max-width: 380px;
      height: auto;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.3));
    }

    .loader-section {
      margin-top: 0.8rem;
      width: 100%;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .status-text {
      color: #ffbf00;
      font-size: 0.85rem;
      text-transform: uppercase;
      font-weight: 600;
      background: rgb(0, 0, 0);
      padding: 0.2rem 0.9rem;
      border-radius: 40px;
      backdrop-filter: blur(2px);
    }

    .percentage {
      font-family: "Monaco", "Menlo", monospace;
      font-weight: 700;
      font-size: 1.4rem;
      background: linear-gradient(135deg, #ffb700, #ffd000);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: 1px;
    }

    .progress-track {
      background-color: #2e1c3a;
      border-radius: 60px;
      height: 8px;
      width: 100%;
      overflow: hidden;
      box-shadow: inset 0 1px 4px rgba(255, 255, 255, 0.5);
      margin: 8px 0 12px 0;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #f6d678, #fdbe00, #ff7b00);
      border-radius: 60px;
      transition: width 0.08s linear;
      box-shadow: 0 0 8px #ffbb00;
    }

    .loading-hint {
      display: flex;
      justify-content: flex-start;
      gap: 8px;
      margin-top: 20px;
      margin-bottom: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: #ffd000;
      border-radius: 50%;
      opacity: 0.5;
      animation: pulseDot 1.2s infinite ease-in-out;
    }

    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes pulseDot {

      0%,
      100% {
        opacity: 0.3;
        transform: scale(0.8);
        background-color: #ffd000;
      }

      50% {
        opacity: 1;
        transform: scale(1.2);
        background-color: #ffd000;
      }
    }

    /* Login form - RTL for Persian */
    .login-wrapper {
      width: 100%;
      max-width: 380px;
      opacity: 0;
      transform: translateY(20px);
      transition:
        opacity 0.6s ease,
        transform 0.6s ease;
      pointer-events: none;
      direction: rtl;
    }

    .login-wrapper.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(4px);
      padding: 1rem 1.8rem;
      border-radius: 1.5rem;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.3);
      text-align: center;
      border: 1px solid rgba(235, 185, 32, 0.4);
    }

    .login-container h2 {
      margin-bottom: 1.5rem;
      color: #1f032f;
      font-weight: 700;
      font-size: 1.8rem;
    }

    input {
      width: 100%;
      padding: 0.85rem;
      margin: 0.6rem 0;
      border: 1px solid #ddd;
      border-radius: 0.75rem;
      font-family: inherit;
      font-size: 1rem;
      transition: 0.2s;
      background: #fefefe;
      text-align: start;
      unicode-bidi: plaintext;

    }

    input:focus {
      outline: none;
      border-color: #ebb920;
      box-shadow: 0 0 0 3px rgba(235, 185, 32, 0.2);
    }

    .log_in_btn {
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, #1f032f, #2c0542);
      color: white;
      border: none;
      border-radius: 0.75rem;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
      transition: 0.2s;
    }

    .log_in_btn:hover {
      background: linear-gradient(135deg, #2c0542, #3e0b5a);
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
    }

    .log_in_btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .error {
      color: #b91c1c;
      margin-top: 1rem;
      font-size: 0.85rem;
      background: rgba(185, 28, 28, 0.1);
      padding: 0.5rem;
      border-radius: 0.5rem;
    }

    .bg-glow {
      position: fixed;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle,
          rgba(235, 185, 32, 0.2),
          transparent 70%);
      border-radius: 50%;
      filter: blur(60px);
      z-index: -1;
      pointer-events: none;
    }

    @keyframes gentlePulse {
      0% {
        transform: scale(1);
        filter: drop-shadow(0 0 0px #ebb920);
      }

      50% {
        transform: scale(1.02);
        filter: drop-shadow(0 0 12px #e8b324);
      }

      100% {
        transform: scale(1);
        filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.3));
      }
    }

    @media (max-width: 550px) {
      .loading-container {
        padding: 1.5rem 1rem;
      }

      .percentage {
        font-size: 1.2rem;
      }

      .logo-svg {
        max-width: 280px;
      }

      .login-container {
        padding: 1.5rem;
        margin: 0 1rem;
      }
    }
  </style>
</head>

  <!-- Login Form (RTL, Persian) -->
  <div class="login-wrapper" id="loginWrapper">
    <div class="login-container">
      <h2>ورود به سیستم</h2>
      <form id="loginForm">
        <input type="text" id="username" placeholder="نام کاربری" required autocomplete="username" />
        <input type="password" id="password" placeholder="رمز عبور" required autocomplete="current-password" />
        <button class="log_in_btn" type="submit" id="loginBtn">ورود</button>
        <div class="error" id="errorMsg"></div>
      </form>
      <!-- WhatsApp support link - opens chat without showing number -->
      <div class="support-wa">
        <p>تماس با پشتیبانی</p>
        <div class="btn_box">
          <button class="primary whatsapp_btn" onclick="openSupport()">

  <script>

    // باز کردن چت واتساپ در تب جدید — شماره: +93782271752
    function openSupport() {
      const phone = "93782271752"; // شماره بدون '+' برای wa.me
      const text = encodeURIComponent("سلام، نیاز به پشتیبانی دارم.");
      window.open("https://wa.me/" + phone + "?text=" + text, "_blank");
    }

    // باز کردن کلاینت ایمیل با آدرس: fahimullahkamal@gmail.com
    function openHelp() {
      const email = "fahimullahkamal@gmail.com";
      const subject = encodeURIComponent("درخواست پشتیبانی");
      const body = encodeURIComponent("سلام، لطفاً راهنمایی کنید.");
      window.location.href =
        "mailto:" + email + "?subject=" + subject + "&body=" + body;
    }


    (function () {
      // Loading screen logic (English texts)
      const progressFill = document.getElementById("progressFill");
      const percentSpan = document.getElementById("percentValue");
      const statusMsgSpan = document.getElementById("statusMsg");
      const loadingDotsDiv = document.getElementById("loadingDots");
      const loadingScreen = document.getElementById("loadingScreen");
      const loginWrapper = document.getElementById("loginWrapper");

      const statusSteps = [
        { threshold: 0, text: "CONNECTING" },
        { threshold: 15, text: "LOADING ASSETS" },
        { threshold: 35, text: "SYNCING SERVICES" },
        { threshold: 60, text: "OPTIMIZING UI" },
        { threshold: 85, text: "FINALIZING" },
      ];

      const DURATION = 2500;
      let startTime = null;
      let animationFrame = null;

      function updateProgressUI(currentPercent) {
        let percent = Math.min(100, Math.max(0, currentPercent));
        progressFill.style.width = percent + "%";
        percentSpan.innerText = Math.floor(percent) + "%";

        let activeStatus = statusSteps[0].text;
        for (let i = statusSteps.length - 1; i >= 0; i--) {
          if (percent >= statusSteps[i].threshold) {
            activeStatus = statusSteps[i].text;
            break;
          }
        }
        if (percent >= 100) activeStatus = "READY";
        statusMsgSpan.innerText = activeStatus;

        if (percent >= 100) {
          if (animationFrame) cancelAnimationFrame(animationFrame);
          animationFrame = null;

          const svgLogo = document.querySelector(".logo-svg");
          if (svgLogo) {
            svgLogo.style.animation = "gentlePulse 0.6s ease";
            setTimeout(() => {
              svgLogo.style.animation = "";
            }, 600);
          }

          loadingScreen.style.opacity = "0";
          setTimeout(() => {
            loadingScreen.style.visibility = "hidden";
            loadingScreen.style.display = "none";
            loginWrapper.classList.add("visible");
          }, 500);
        }
      }

      function startSmoothLoading() {
        startTime = performance.now();
        function step(now) {
          const elapsed = now - startTime;
          let rawPercent = (elapsed / DURATION) * 100;
          if (rawPercent >= 100) {
            updateProgressUI(100);
            return;
          }
          updateProgressUI(rawPercent);
          animationFrame = requestAnimationFrame(step);
        }
        animationFrame = requestAnimationFrame(step);

        setTimeout(() => {
          if (progressFill.style.width !== "100%") {
            updateProgressUI(100);
          }
          if (animationFrame) cancelAnimationFrame(animationFrame);
        }, DURATION + 150);
      }

      startSmoothLoading();

      // Login handler (unchanged)
      const loginForm = document.getElementById("loginForm");
      const loginBtn = document.getElementById("loginBtn");
      const errorDiv = document.getElementById("errorMsg");

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        if (!username || !password) {
          errorDiv.textContent = "لطفاً نام کاربری و رمز عبور را وارد کنید";
          return;
        }

        loginBtn.disabled = true;
        loginBtn.textContent = "در حال ورود ...";
        errorDiv.textContent = "";

        try {
          const res = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });
          const data = await res.json();
          if (res.ok) {
            window.location.href = "/";
          } else {
            errorDiv.textContent =
              data.error || "نام کاربری یا رمز عبور نادرست است";
            loginBtn.disabled = false;
            loginBtn.textContent = "ورود";
          }
        } catch (err) {
          console.error(err);
          errorDiv.textContent =
            "خطا در ارتباط با سرور. لطفاً بعداً تلاش کنید.";
          loginBtn.disabled = false;
          loginBtn.textContent = "ورود";
        }
      });
    })();
  </script>
