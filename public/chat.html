<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>چت‌ربات گزارش‌گیر</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto;
        background: #f6f8fb;
        padding: 18px;
        color: #111;
      }
      .app {
        max-width: 820px;
        margin: 10px auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 6px 18px rgba(12, 20, 40, 0.06);
        overflow: hidden;
      }
      .header {
        padding: 14px 18px;
        border-bottom: 1px solid #eef2f7;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .messages {
        height: 100%;
        height: 100vh;
        overflow: auto;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: #fbfdff;
      }
      .msg {
        max-width: 78%;
        padding: 10px 12px;
        border-radius: 10px;
      }
      .msg.user {
        align-self: flex-end;
        background: #0b74de;
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .msg.bot {
        align-self: flex-start;
        background: #f1f5f9;
        color: #111;
      }
      .composer {
        display: flex;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid #eef2f7;
      }
      input[type="text"] {
        flex: 1;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #dfe7f1;
      }
      button {
        padding: 10px 12px;
        border-radius: 8px;
        border: 0;
        background: #0b74de;
        color: #fff;
      }
      .meta {
        font-size: 13px;
        color: #6b7280;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
      }
      th,
      td {
        padding: 6px;
        border: 1px solid #eef2f7;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="header">
        <p>fahimullah ۲۰۰۰ هزار دالر خریداری کرده</p>
        <div>
          <strong>چت‌ربات گزارش‌گیر</strong>
          <div class="meta">با Groq متصل — پیام بده و گزارش/تحلیل بگیر</div>
        </div>
        <div style="font-size: 13px; color: #6b7280">
          آدرس API: /api/ai/chat
        </div>
      </div>
      <div id="messages" class="messages"></div>

      <div class="composer">
        <input
          id="msgInput"
          type="text"
          placeholder="مثال: فروش 2026/02 یا پرفروش ترین 5 کالا..."
        />
        <button id="sendBtn">ارسال</button>
      </div>
    </div>

    <script>
      const messagesEl = document.getElementById("messages");
      const input = document.getElementById("msgInput");
      const sendBtn = document.getElementById("sendBtn");

      function appendMessage(text, who = "bot") {
        const d = document.createElement("div");
        d.className = "msg " + (who === "user" ? "user" : "bot");
        // if text is an object with data table, render table
        if (typeof text === "object" && text !== null) {
          // assume { reply, data }
          d.innerHTML = `<div style="white-space:pre-wrap">${escapeHtml(text.reply || "")}</div>`;
          if (Array.isArray(text.data) && text.data.length) {
            const cols = Object.keys(text.data[0]);
            let html =
              "<table><thead><tr>" +
              cols.map((c) => `<th>${escapeHtml(c)}</th>`).join("") +
              "</tr></thead><tbody>";
            html += text.data
              .map(
                (r) =>
                  "<tr>" +
                  cols
                    .map((c) => `<td>${escapeHtml(String(r[c] || ""))}</td>`)
                    .join("") +
                  "</tr>",
              )
              .join("");
            html += "</tbody></table>";
            d.innerHTML += html;
          }
        } else {
          d.textContent = text;
        }
        messagesEl.appendChild(d);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;
        appendMessage(text, "user");
        input.value = "";
        appendMessage("در حال پردازش...", "bot");
        try {
          const r = await fetch("/api/ai/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text }),
          });
          const j = await r.json();
          // remove last "در حال پردازش..." message
          const last = messagesEl.querySelector(".msg.bot:last-child");
          if (last && last.textContent === "در حال پردازش...") last.remove();

          if (!r.ok) {
            appendMessage(`خطا: ${j && j.error ? j.error : r.statusText}`);
            return;
          }
          // if j.data exists, append structured response
          if (j.data) {
            appendMessage({ reply: j.reply || "(بدون متن)", data: j.data });
          } else {
            appendMessage(j.reply || "(بدون پاسخ)");
          }
        } catch (err) {
          const last = messagesEl.querySelector(".msg.bot:last-child");
          if (last && last.textContent === "در حال پردازش...") last.remove();
          appendMessage("خطا در ارتباط با سرور: " + err.message);
        }
      }

      sendBtn.onclick = sendMessage;
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendMessage();
      });

      // welcome message
      appendMessage(
        "سلام! من می‌توانم گزارش‌ها و تحلیل‌های ساده از دیتابیس به تو بدم. مثال‌ها:\n- فروش 2026/02\n- پرفروش ترین 5 کالا\n- کالا P-001 با چه چیزهایی فروخته شده؟",
      );
    </script>
  </body>
</html>
