<!--?xml version="1.0" encoding="utf-8"?-->
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="نماد دوفاری">
  <title>دوفاری — نماد</title>
  <defs>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"></feGaussianBlur>
      <feBlend in="SourceGraphic" in2="b" mode="normal"></feBlend>
    </filter>
  </defs>

  <!-- پس‌زمینه دایره -->
  <circle cx="200" cy="200" r="190" fill="#1f032f"></circle>

  <!-- حروف سفید داخل دایره -->
  <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" font-family="IRANSans, 'Noto Nastaliq Urdu', Tahoma, 'Segoe UI', sans-serif" font-weight="800" font-size="190" fill="#ffffff" direction="rtl">
        Li
  </text>
</svg>